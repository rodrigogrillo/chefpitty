<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda | Chef Pitty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17120E">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../assets/favicon.png" type="image/png" sizes="144x144">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17120E; --bg-alt:#1F1913; --card:#251E17; --ink:#F3EBDD; --ink-muted:#B9AC96; --ink-faint:#7D7362;
    --gold:#C68E39; --gold-soft:#E2AC5A; --herb:#2A6F4F; --herb-soft:#5BB38A; --warn:#E0834A;
    --line:rgba(243,235,221,0.12);
    --serif:"Instrument Serif",Georgia,serif; --sans:"Public Sans",-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:110px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px}

  header.top{position:sticky;top:0;z-index:20;background:rgba(23,18,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top-in{display:flex;align-items:center;gap:12px;height:62px}
  .top-in img{width:36px;height:36px;border-radius:8px}
  .top-in h1{font-family:var(--serif);font-weight:400;font-size:1.7rem;letter-spacing:-.01em;line-height:1}
  .top-in .sp{flex:1}
  .back{font-size:.82rem;color:var(--ink-muted);padding:8px 0}
  .back:hover{color:var(--gold-soft)}

  .proto{margin:16px 0 0;background:rgba(198,142,57,.12);border:1px solid rgba(198,142,57,.35);color:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.86rem;line-height:1.45}
  .proto b{font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
  .stat .n{font-family:var(--serif);font-size:2rem;line-height:1;color:var(--ink)}
  .stat .l{font-size:.74rem;color:var(--ink-muted);margin-top:6px;line-height:1.3}
  .stat.warn .n{color:var(--warn)}
  .stat.ok .n{color:var(--herb-soft)}

  .chips{display:flex;gap:8px;margin-top:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink-muted);padding:10px 16px;border-radius:30px;font-size:.88rem;font-weight:500;min-height:44px}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a120a;font-weight:600}

  .month{margin-top:28px}
  .month h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;text-transform:capitalize;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
  .month h2 small{font-family:var(--sans);font-size:.78rem;color:var(--ink-faint);font-weight:500;text-transform:none}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:10px}

  .ev{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:stretch;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s, transform .15s}
  .ev:hover{border-color:rgba(198,142,57,.5)}
  .ev:active{transform:scale(.99)}
  .ev.past{opacity:.55}
  .date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;padding:8px 0}
  .date .d{font-family:var(--serif);font-size:2rem;line-height:1}
  .date .w{font-size:.7rem;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:600}
  .ev .name{font-weight:600;font-size:1.05rem;line-height:1.25}
  .ev .full{font-size:.92rem;font-weight:600;color:var(--gold-soft);margin-top:2px;letter-spacing:.01em}
  .ev .meta{color:var(--ink-muted);font-size:.86rem;margin-top:4px}
  .ev .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:30px}
  .badge.ok{background:rgba(91,179,138,.14);color:var(--herb-soft)}
  .badge.pend{background:rgba(224,131,74,.14);color:var(--warn)}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .val{font-size:.86rem;color:var(--ink);font-weight:500}

  .empty{margin-top:40px;text-align:center;color:var(--ink-muted);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
  .empty b{display:block;font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--ink);margin-bottom:6px}

  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:var(--gold);color:#1a120a;font-weight:700;border-radius:40px;padding:0 24px 0 18px;height:58px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .fab svg{width:24px;height:24px}
  .fab:hover{background:var(--gold-soft)}

  .exp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:34px;height:54px;border:1px solid rgba(198,142,57,.5);border-radius:14px;color:var(--gold-soft);font-weight:600;font-size:.98rem}
  .exp:hover{background:rgba(198,142,57,.1)}
  .exp svg{width:20px;height:20px}
  .foot{margin-top:44px;text-align:center;font-size:.8rem;color:var(--ink-faint)}
  .foot button{color:var(--ink-muted);text-decoration:underline;text-underline-offset:3px;padding:10px 8px}

  /* sheet */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:560px;max-height:94vh;overflow:auto;background:var(--bg-alt);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line)}}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:1.8rem;margin-bottom:16px}
  label.f{display:block;margin-top:14px}
  label.f span{display:block;font-size:.82rem;color:var(--ink-muted);margin-bottom:6px;font-weight:500}
  .in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:52px;font-size:1rem;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
  .in:focus{border-color:var(--gold)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input[type=date].in{color-scheme:dark}
  .money{position:relative}
  .money i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink-muted)}
  .money .in{padding-left:44px}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
  .toggle .t{font-weight:600}
  .toggle .s{font-size:.8rem;color:var(--ink-muted)}
  .sw{flex:0 0 auto;width:54px;height:32px;border-radius:30px;background:#4a4136;position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle[aria-pressed="true"] .sw{background:var(--herb)}
  .toggle[aria-pressed="true"] .sw::after{transform:translateX(22px)}
  .dup{display:none;margin-top:14px;background:rgba(224,131,74,.12);border:1px solid rgba(224,131,74,.4);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.88rem}
  .dup.show{display:block}
  .err{color:var(--warn);font-size:.82rem;margin-top:6px;display:none}
  .err.show{display:block}
  .actions{display:flex;gap:10px;margin-top:22px}
  .btn{flex:1;height:54px;border-radius:14px;font-weight:700;font-size:1rem}
  .btn.main{background:var(--gold);color:#1a120a}
  .btn.main:hover{background:var(--gold-soft)}
  .btn.ghost{border:1px solid var(--line);color:var(--ink-muted);flex:0 0 auto;padding:0 20px}
  .btn.del{color:var(--warn);border:1px solid rgba(224,131,74,.4);flex:0 0 auto;padding:0 18px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#1a120a;padding:12px 20px;border-radius:30px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:360px){.stats{gap:6px}.stat{padding:12px 8px}}
  body.is-auth #appView{display:none}
  body:not(.is-auth) #loginView{display:none}
  body.is-auth{padding-bottom:0}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
  .login-card{width:100%;max-width:400px;background:var(--bg-alt);border:1px solid var(--line);border-radius:24px;padding:30px 22px 26px}
  .login-logo{width:58px;height:58px;border-radius:14px;margin:0 auto 14px}
  .login-card h1{font-family:var(--serif);font-weight:400;font-size:2.2rem;text-align:center;line-height:1.1}
  .login-sub{text-align:center;color:var(--ink-muted);font-size:.92rem;margin-top:6px;margin-bottom:6px}
  .login-btn{width:100%;margin-top:20px;flex:none}
  .pw{position:relative}
  .pw .in{padding-right:84px}
  .pwtoggle{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;color:var(--gold-soft);font-size:.85rem;font-weight:600}
  .btn[disabled]{opacity:.6;cursor:default}
  .back{background:none;border:1px solid var(--line);border-radius:30px;padding:8px 16px;min-height:40px;color:var(--ink-muted)}
  .loading{margin-top:40px;text-align:center;color:var(--ink-muted);padding:30px 10px}
  .loading .retry{margin-top:14px;border:1px solid var(--line);border-radius:30px;padding:10px 20px;color:var(--gold-soft);font-weight:600}
  [hidden]{display:none !important}
  .login-logo{display:block}

  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:4px;margin-top:18px}
  .seg button{flex:1;height:42px;border-radius:26px;color:var(--ink-muted);font-weight:600;font-size:.92rem}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#1a120a}
  .cal-head{display:flex;align-items:center;gap:8px;margin-top:22px}
  .cal-title{flex:1;text-align:center;font-family:var(--serif);font-size:1.7rem;text-transform:capitalize;letter-spacing:-.01em;line-height:1.1}
  .cal-title small{font-family:var(--sans);font-size:.8rem;color:var(--ink-faint);margin-left:6px}
  .cal-nav{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;font-size:1.4rem;line-height:1;color:var(--ink)}
  .cal-nav:hover{border-color:var(--gold)}
  .cal-today{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:30px;color:var(--gold-soft);font-weight:600;font-size:.85rem}
  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;text-align:center;font-size:.7rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
  .cal-day{min-height:58px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:left;transition:border-color .15s}
  .cal-day:hover{border-color:rgba(198,142,57,.5)}
  .cal-day.out{background:transparent;border-color:transparent;pointer-events:none}
  .cal-day .dn{font-size:.88rem;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
  .cal-day.today .dn{background:var(--gold);color:#1a120a}
  .cal-day.sel{border-color:var(--gold-soft);box-shadow:0 0 0 1px var(--gold-soft)}
  .cal-day.past .dn{opacity:.55}
  .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.ok{background:var(--herb-soft)} .dot.pend{background:var(--warn)}
  .cevs{display:none}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:.78rem;color:var(--ink-muted)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .day-panel{margin-top:24px}
  .day-panel h3{font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.15}
  .day-panel h3::first-letter{text-transform:uppercase}
  .day-panel .none{color:var(--ink-muted);font-size:.92rem;margin-top:8px}
  .day-panel .list{margin-top:12px}
  .add-day{margin-top:12px;width:100%;height:52px;border:1px dashed rgba(198,142,57,.6);border-radius:14px;color:var(--gold-soft);font-weight:600}
  .add-day:hover{background:rgba(198,142,57,.1)}
  @media(min-width:640px){
    .cal-day{min-height:104px;align-items:stretch;padding:6px}
    .cal-day .dn{align-self:flex-start}
    .dots{display:none}
    .cevs{display:flex;flex-direction:column;gap:3px;min-width:0}
    .cev{display:block;font-size:.72rem;padding:3px 6px;border-radius:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
    .cev.ok{background:rgba(91,179,138,.18);color:var(--herb-soft)}
    .cev.pend{background:rgba(224,131,74,.18);color:var(--warn)}
    .cmore{font-size:.7rem;color:var(--ink-muted);padding-left:4px}
  }
</style>
</head>
<body class="is-auth">

<!-- LOGIN -->
<section class="login" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <img src="../assets/logo-icon.png" alt="Chef Pitty" class="login-logo">
    <h1>Agenda</h1>
    <p class="login-sub">Entre para ver os seus eventos.</p>
    <label class="f"><span>E-mail</span>
      <input class="in" id="lEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="f"><span>Senha</span>
      <div class="pw"><input class="in" id="lPass" type="password" autocomplete="current-password"><button type="button" id="lShow" class="pwtoggle" aria-label="Mostrar senha">Mostrar</button></div></label>
    <div class="dup show" id="lErr" hidden></div>
    <button type="submit" class="btn main login-btn" id="lBtn">Entrar</button>
  </form>
</section>

<!-- APP -->
<div id="appView">
<header class="top">
  <div class="wrap top-in">
    <img src="../assets/logo-icon.png" alt="Chef Pitty">
    <h1>Agenda</h1>
    <span class="sp"></span>
    <button class="back" id="logout" type="button">Sair</button>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>

  <div class="seg" role="group" aria-label="Modo de visualização">
    <button type="button" data-view="lista" aria-pressed="true">Lista</button>
    <button type="button" data-view="cal" aria-pressed="false">Calendário</button>
  </div>

  <div class="chips" role="group" aria-label="Filtrar eventos">
    <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-f="pend" aria-pressed="false">Falta entrada</button>
    <button class="chip" data-f="pago" aria-pressed="false">Entrada paga</button>
  </div>

  <div id="app"></div>

  <button class="exp" id="export" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    Exportar agenda (planilha)
  </button>
</main>

<button class="fab" id="add" aria-label="Novo evento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Novo evento
</button>

<div class="overlay" id="ov" aria-hidden="true">
  <form class="sheet" id="form" novalidate>
    <h3 id="ftitle">Novo evento</h3>
    <label class="f"><span>Nome (noiva ou cliente)</span>
      <input class="in" id="fName" type="text" autocomplete="off" placeholder="Ex.: Mariana e Rafael">
      <div class="err" id="eName">Escreva o nome para salvar.</div></label>
    <div class="two">
      <label class="f"><span>Data</span>
        <input class="in" id="fDate" type="date">
        <div class="err" id="eDate">Escolha a data.</div></label>
      <label class="f"><span>Convidados</span>
        <input class="in" id="fGuests" type="number" inputmode="numeric" min="0" placeholder="Ex.: 80"></label>
    </div>
    <label class="f"><span>Local</span>
      <input class="in" id="fLocal" type="text" autocomplete="off" placeholder="Ex.: Espaço Villa, Rio Preto"></label>
    <label class="f"><span>Valor da reserva de data</span>
      <div class="money"><i>R$</i><input class="in" id="fVal" type="text" inputmode="numeric" placeholder="0,00"></div></label>
    <button type="button" class="toggle" id="fPaid" aria-pressed="false">
      <span><span class="t">Entrada paga</span><br><span class="s" id="fPaidS">Ainda falta a entrada</span></span>
      <span class="sw"></span>
    </button>
    <div class="dup" id="dup"></div>
    <div class="actions">
      <button type="button" class="btn del" id="fDel" hidden>Apagar</button>
      <button type="button" class="btn ghost" id="fCancel">Cancelar</button>
      <button type="submit" class="btn main" id="fSave">Salvar</button>
    </div>
  </form>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var SUPA_URL = "https://acywsbczunkwglwzlumb.supabase.co";
  var SUPA_KEY = "sb_publishable_XsaoLtIVddEpAd-0vp196g_auu5uqt2";
  var SKEY = "chefpitty_agenda_session_v1";
  var MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var WD = ["dom","seg","ter","qua","qui","sex","sáb"];
  var VKEY="chefpitty_agenda_view_v1", view="lista", calMonth=(function(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),1);})(), selDay=iso(new Date()), filter = "todos", editingId = null, dupOk = false, events = [], session = null, saving = false;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function pad(n){ return n<10?"0"+n:""+n; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parse(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function brl(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},2400); }

  try{ if(localStorage.getItem(VKEY)==="cal") view="cal"; }catch(e){}
  function syncSeg(){ document.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-view")===view?"true":"false"); }); }

  /* ---------- sessão ---------- */
  function loadSession(){ try{ var r=localStorage.getItem(SKEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function storeSession(s){ try{ if(s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); }catch(e){} }
  function setSession(d){
    session = d ? { access_token:d.access_token, refresh_token:d.refresh_token, expires_at: d.expires_at || (Math.floor(Date.now()/1000)+(d.expires_in||3600)) } : null;
    storeSession(session);
  }
  function netError(){ var e=new Error("Sem conexão. Confira a internet e tente de novo."); e.net=true; return e; }

  function authFetch(path, body){
    return fetch(SUPA_URL+path, { method:"POST", headers:{ "apikey":SUPA_KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) })
      .catch(function(){ throw netError(); });
  }
  function refresh(){
    if(!session || !session.refresh_token) return Promise.reject(new Error("sem sessão"));
    return authFetch("/auth/v1/token?grant_type=refresh_token", { refresh_token: session.refresh_token }).then(function(r){
      if(!r.ok){ setSession(null); throw new Error("sessão expirada"); }
      return r.json().then(setSession);
    });
  }
  function ensureFresh(){
    if(!session) return Promise.reject(new Error("sem sessão"));
    if(session.expires_at - Math.floor(Date.now()/1000) < 60) return refresh();
    return Promise.resolve();
  }
  function api(method, path, body, retried){
    return ensureFresh().then(function(){
      var h = { "apikey":SUPA_KEY, "Authorization":"Bearer "+session.access_token, "Content-Type":"application/json" };
      if(method==="POST"||method==="PATCH") h["Prefer"]="return=representation";
      return fetch(SUPA_URL+"/rest/v1/"+path, { method:method, headers:h, body: body?JSON.stringify(body):undefined }).catch(function(){ throw netError(); });
    }).then(function(r){
      if(r.status===401 && !retried){ return refresh().then(function(){ return api(method,path,body,true); }); }
      if(!r.ok){ return r.text().then(function(t){ var det=""; try{ var j=JSON.parse(t); det=[j.code,j.message].filter(Boolean).join(": "); }catch(x){} var e=new Error("Não foi possível concluir (erro "+r.status+")."+(det?" Detalhe: "+det:"")); e.status=r.status; throw e; }); }
      return r.status===204 ? null : r.json();
    });
  }

  /* ---------- mapeamento ---------- */
  function fromDb(r){ return { id:r.id, name:r.nome, date:r.data, guests:r.convidados||0, local:r.local||"", val:Number(r.valor)||0, paid:!!r.entrada_paga }; }
  function toDb(e){ return { nome:e.name, data:e.date, convidados:e.guests||null, local:e.local||null, valor:e.val||null, entrada_paga:!!e.paid }; }

  /* ---------- telas ---------- */
  function showLogin(msg){
    document.body.classList.add("is-auth"); closeSheet();
    var er=$("lErr"); if(msg){ er.textContent=msg; er.hidden=false; } else { er.hidden=true; }
    $("lBtn").disabled=false; $("lBtn").textContent="Entrar";
  }
  function showApp(){ document.body.classList.remove("is-auth"); }

  function loadEvents(){
    $("app").innerHTML='<div class="loading">Carregando a agenda...</div>';
    return api("GET","eventos?select=*&order=data.asc").then(function(rows){
      events = rows.map(fromDb); render();
    }).catch(function(e){
      if(!session){ showLogin("Sua sessão expirou. Entre de novo."); return; }
      $("app").innerHTML='<div class="loading">'+esc(e.message||"Erro ao carregar.")+'<br><button class="retry" id="retry" type="button">Tentar de novo</button></div>';
      $("retry").addEventListener("click", loadEvents);
    });
  }

  /* ---------- login ---------- */
  $("lShow").addEventListener("click", function(){
    var p=$("lPass"), s=p.type==="password"; p.type=s?"text":"password"; this.textContent=s?"Ocultar":"Mostrar";
  });
  $("loginForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var email=$("lEmail").value.trim(), pass=$("lPass").value;
    if(!email||!pass){ $("lErr").textContent="Preencha o e-mail e a senha."; $("lErr").hidden=false; return; }
    $("lBtn").disabled=true; $("lBtn").textContent="Entrando...";
    authFetch("/auth/v1/token?grant_type=password",{ email:email, password:pass }).then(function(r){
      if(!r.ok){ throw new Error(r.status===400||r.status===401 ? "E-mail ou senha incorretos." : "Não foi possível entrar agora. Tente de novo."); }
      return r.json();
    }).then(function(d){
      setSession(d); $("lPass").value=""; showApp(); loadEvents();
    }).catch(function(e){ showLogin(e.message); });
  });
  $("logout").addEventListener("click", function(){
    var tk = session && session.access_token;
    if(tk){ fetch(SUPA_URL+"/auth/v1/logout",{ method:"POST", headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+tk } }).catch(function(){}); }
    setSession(null); events=[]; $("lEmail").value=""; showLogin();
  });

  /* ---------- lista ---------- */
  function render(){
    var today=new Date(); today.setHours(0,0,0,0);
    var sorted = events.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    var upcoming = sorted.filter(function(e){ return parse(e.date)>=today; });
    var pend = upcoming.filter(function(e){ return !e.paid; });
    $("stats").innerHTML =
      '<div class="stat"><div class="n">'+upcoming.length+'</div><div class="l">próximos eventos</div></div>'+
      '<div class="stat warn"><div class="n">'+pend.length+'</div><div class="l">falta entrada</div></div>'+
      '<div class="stat ok"><div class="n">'+(upcoming.length-pend.length)+'</div><div class="l">entrada paga</div></div>';

    var list = sorted.filter(function(e){ return filter==="todos" || (filter==="pend" && !e.paid) || (filter==="pago" && e.paid); });
    var app=$("app");
    if(view==="cal"){ renderCal(list, today); return; }
    if(!list.length){
      app.innerHTML='<div class="empty"><b>'+(events.length?'Nenhum evento neste filtro':'Sua agenda está vazia')+'</b>'+(events.length?'Toque em "Todos" para ver tudo.':'Toque em "Novo evento" para cadastrar o primeiro.')+'</div>';
      return;
    }
    var groups={}, order=[];
    list.forEach(function(e){ var d=parse(e.date), k=d.getFullYear()+"-"+pad(d.getMonth()+1); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(e); });
    var html="";
    order.forEach(function(k){
      var p=k.split("-"), items=groups[k];
      html+='<section class="month"><h2>'+MONTHS[+p[1]-1]+' <small>'+p[0]+' · '+items.length+(items.length===1?' evento':' eventos')+'</small></h2><div class="list">';
      items.forEach(function(e){
        var d=parse(e.date), past=d<today;
        var meta=[]; if(e.guests) meta.push(e.guests+" convidados"); if(e.local) meta.push(esc(e.local));
        html+='<button class="ev'+(past?' past':'')+'" data-id="'+esc(e.id)+'">'+
          '<div class="date"><span class="d">'+pad(d.getDate())+'</span><span class="w">'+WD[d.getDay()]+'</span></div>'+
          '<div><div class="name">'+esc(e.name)+'</div>'+
          '<div class="full">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+'</div>'+
          (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+
          '<div class="row"><span class="badge '+(e.paid?'ok':'pend')+'">'+(e.paid?'Entrada paga':'Falta entrada')+'</span>'+
          (e.val?'<span class="val">Reserva '+brl(e.val)+'</span>':'')+'</div></div></button>';
      });
      html+='</div></section>';
    });
    app.innerHTML=html;
  }


  /* ---------- calendário ---------- */
  function evCard(e, today){
    var d=parse(e.date), past=d<today, meta=[];
    if(e.guests) meta.push(e.guests+" convidados"); if(e.local) meta.push(esc(e.local));
    return '<button class="ev'+(past?' past':'')+'" data-id="'+esc(e.id)+'">'+
      '<div class="date"><span class="d">'+pad(d.getDate())+'</span><span class="w">'+WD[d.getDay()]+'</span></div>'+
      '<div><div class="name">'+esc(e.name)+'</div>'+
      '<div class="full">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+'</div>'+
      (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+
      '<div class="row"><span class="badge '+(e.paid?'ok':'pend')+'">'+(e.paid?'Entrada paga':'Falta entrada')+'</span>'+
      (e.val?'<span class="val">Reserva '+brl(e.val)+'</span>':'')+'</div></div></button>';
  }
  function renderCal(list, today){
    var y=calMonth.getFullYear(), m=calMonth.getMonth();
    var offset=new Date(y,m,1).getDay(), ndays=new Date(y,m+1,0).getDate();
    var total=Math.ceil((offset+ndays)/7)*7, todayIso=iso(today), byDay={};
    list.forEach(function(e){ (byDay[e.date]=byDay[e.date]||[]).push(e); });
    var h='<div class="cal-head"><button class="cal-nav" data-act="prev" type="button" aria-label="Mês anterior">&#8249;</button>'+
      '<div class="cal-title">'+MONTHS[m]+'<small>'+y+'</small></div>'+
      '<button class="cal-nav" data-act="next" type="button" aria-label="Próximo mês">&#8250;</button>'+
      '<button class="cal-today" data-act="today" type="button">Hoje</button></div>';
    h+='<div class="cal-wd">'+WD.map(function(w){return '<div>'+w+'</div>';}).join("")+'</div><div class="cal-grid">';
    for(var i=0;i<total;i++){
      var n=i-offset+1;
      if(n<1||n>ndays){ h+='<div class="cal-day out"></div>'; continue; }
      var key=y+"-"+pad(m+1)+"-"+pad(n), evs=byDay[key]||[];
      var cls="cal-day"+(key===todayIso?" today":"")+(key===selDay?" sel":"")+(key<todayIso?" past":"");
      var label=n+" de "+MONTHS[m]+(evs.length?", "+evs.length+(evs.length===1?" evento":" eventos"):"");
      h+='<button type="button" class="'+cls+'" data-act="day" data-date="'+key+'" aria-label="'+esc(label)+'"><span class="dn">'+n+'</span>';
      if(evs.length){
        h+='<div class="dots">'+evs.slice(0,4).map(function(e){return '<i class="dot '+(e.paid?'ok':'pend')+'"></i>';}).join("")+'</div>';
        h+='<div class="cevs">'+evs.slice(0,3).map(function(e){return '<span class="cev '+(e.paid?'ok':'pend')+'">'+esc(e.name)+'</span>';}).join("")+(evs.length>3?'<span class="cmore">+'+(evs.length-3)+' mais</span>':'')+'</div>';
      }
      h+='</button>';
    }
    h+='</div><div class="cal-legend"><span><i class="dot pend"></i>Falta entrada</span><span><i class="dot ok"></i>Entrada paga</span></div>';
    // painel do dia
    if(selDay){
      var sd=parse(selDay), dayEvs=byDay[selDay]||[];
      h+='<div class="day-panel"><h3>'+sd.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</h3>';
      if(dayEvs.length) h+='<div class="list">'+dayEvs.map(function(e){return evCard(e,today);}).join("")+'</div>';
      else h+='<p class="none">Nenhum evento neste dia.</p>';
      h+='<button class="add-day" type="button" data-act="addday">+ Novo evento neste dia</button></div>';
    } else {
      h+='<div class="day-panel"><p class="none">Toque em um dia para ver os eventos.</p></div>';
    }
    $("app").innerHTML=h;
  }
  function setView(v){
    view=v; try{ localStorage.setItem(VKEY,v); }catch(e){}
    syncSeg(); render();
  }
  document.querySelector(".seg").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(b) setView(b.getAttribute("data-view"));
  });
  $("app").addEventListener("click", function(e){
    var a=e.target.closest("[data-act]"); if(!a) return;
    var act=a.getAttribute("data-act");
    if(act==="prev"||act==="next"){
      calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()+(act==="next"?1:-1), 1);
      var t=new Date(); selDay=(calMonth.getFullYear()===t.getFullYear()&&calMonth.getMonth()===t.getMonth())?iso(t):null;
      render();
    } else if(act==="today"){
      var n=new Date(); calMonth=new Date(n.getFullYear(), n.getMonth(), 1); selDay=iso(n); render();
    } else if(act==="day"){
      selDay=a.getAttribute("data-date"); render();
      var p=document.querySelector(".day-panel"); if(p && p.scrollIntoView) p.scrollIntoView({behavior:"smooth",block:"nearest"});
    } else if(act==="addday"){
      openSheet(null, selDay);
    }
  });

  /* ---------- formulário ---------- */
  function setPaid(v){ $("fPaid").setAttribute("aria-pressed", v?"true":"false"); $("fPaidS").textContent = v?"Entrada recebida":"Ainda falta a entrada"; }
  function isPaid(){ return $("fPaid").getAttribute("aria-pressed")==="true"; }
  function fmtMoneyInput(el){
    var digits=el.value.replace(/\D/g,"");
    if(!digits){ el.value=""; return; }
    el.value=(parseInt(digits,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function parseMoney(s){ var d=s.replace(/\D/g,""); return d?parseInt(d,10)/100:0; }
  function formMsg(t){ var d=$("dup"); if(t){ d.textContent=t; d.classList.add("show"); } else d.classList.remove("show"); }
  function setBusy(b){ saving=b; $("fSave").disabled=b; $("fDel").disabled=b; $("fSave").textContent=b?"Salvando...":"Salvar"; }

  function openSheet(id, presetDate){
    editingId=id||null; dupOk=false; setBusy(false); formMsg("");
    $("eName").classList.remove("show"); $("eDate").classList.remove("show");
    var e = id ? events.filter(function(x){return x.id===id;})[0] : null;
    $("ftitle").textContent = e ? "Editar evento" : "Novo evento";
    $("fName").value = e?e.name:"";
    $("fDate").value = e?e.date:(presetDate||"");
    $("fGuests").value = e&&e.guests?e.guests:"";
    $("fLocal").value = e?e.local:"";
    $("fVal").value = e&&e.val ? e.val.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
    setPaid(e?e.paid:false);
    $("fDel").hidden = !e; $("fDel").textContent="Apagar"; delete $("fDel").dataset.sure;
    $("ov").classList.add("open"); $("ov").setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    if(!e) setTimeout(function(){ $("fName").focus(); }, 80);
  }
  function closeSheet(){ $("ov").classList.remove("open"); $("ov").setAttribute("aria-hidden","true"); document.body.style.overflow=""; }

  $("add").addEventListener("click", function(){ openSheet(); });
  $("fCancel").addEventListener("click", function(){ if(!saving) closeSheet(); });
  $("ov").addEventListener("click", function(e){ if(e.target===$("ov") && !saving) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !saving) closeSheet(); });
  $("fPaid").addEventListener("click", function(){ setPaid(!isPaid()); });
  $("fVal").addEventListener("input", function(){ fmtMoneyInput(this); });
  $("fDate").addEventListener("change", function(){ dupOk=false; formMsg(""); });

  $("app").addEventListener("click", function(e){ var b=e.target.closest(".ev"); if(b) openSheet(b.getAttribute("data-id")); });
  document.querySelector(".chips").addEventListener("click", function(e){
    var c=e.target.closest(".chip"); if(!c) return;
    filter=c.getAttribute("data-f");
    document.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", x===c?"true":"false"); });
    render();
  });

  function failMsg(e){
    if(e && e.net) return e.message;
    if(!session) { closeSheet(); showLogin("Sua sessão expirou. Entre de novo."); return null; }
    return (e && e.message) || "Não foi possível salvar. Tente de novo.";
  }

  $("form").addEventListener("submit", function(ev){
    ev.preventDefault(); if(saving) return;
    var name=$("fName").value.trim(), date=$("fDate").value;
    $("eName").classList.toggle("show", !name); $("eDate").classList.toggle("show", !date);
    if(!name||!date) return;
    var clash = events.filter(function(x){ return x.date===date && x.id!==editingId; });
    if(clash.length && !dupOk){
      formMsg("Atenção: já existe evento nesta data ("+clash[0].name+"). Toque em Salvar de novo se quiser manter os dois.");
      dupOk=true; return;
    }
    var data={ name:name, date:date, guests:parseInt($("fGuests").value,10)||0, local:$("fLocal").value.trim(), val:parseMoney($("fVal").value), paid:isPaid() };
    setBusy(true); formMsg("");
    var req = editingId ? api("PATCH","eventos?id=eq."+encodeURIComponent(editingId), toDb(data)) : api("POST","eventos", toDb(data));
    req.then(function(rows){
      var saved = rows && rows[0] ? fromDb(rows[0]) : null;
      if(!saved) throw new Error("Não foi possível salvar. Tente de novo.");
      if(editingId) events = events.map(function(x){ return x.id===editingId ? saved : x; }); else events.push(saved);
      if(view==="cal"){ var sdt=parse(saved.date); calMonth=new Date(sdt.getFullYear(), sdt.getMonth(), 1); selDay=saved.date; }
      setBusy(false); closeSheet(); render(); toast(editingId?"Evento atualizado":"Evento salvo");
    }).catch(function(e){ setBusy(false); var m=failMsg(e); if(m) formMsg(m); });
  });

  $("fDel").addEventListener("click", function(){
    if(!editingId || saving) return;
    var b=$("fDel");
    if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar"; setTimeout(function(){ b.textContent="Apagar"; delete b.dataset.sure; },3000); return; }
    setBusy(true);
    api("DELETE","eventos?id=eq."+encodeURIComponent(editingId)).then(function(){
      events=events.filter(function(x){ return x.id!==editingId; });
      setBusy(false); closeSheet(); render(); toast("Evento apagado");
    }).catch(function(e){ setBusy(false); var m=failMsg(e); if(m) formMsg(m); });
  });

  /* ---------- exportar ---------- */
  function csvCell(v){
    var t=String(v==null?"":v);
    if(/^[=+\-@\t\r]/.test(t)) t="'"+t;
    return '"'+t.replace(/"/g,'""')+'"';
  }
  $("export").addEventListener("click", function(){
    if(!events.length){ toast("Não há eventos para exportar"); return; }
    var rows=[["Data","Nome","Convidados","Local","Valor da reserva (R$)","Entrada paga"]];
    events.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }).forEach(function(e){
      var d=parse(e.date);
      rows.push([pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(), e.name, e.guests||"", e.local||"", e.val?e.val.toFixed(2).replace(".",","):"", e.paid?"Sim":"Não"]);
    });
    var csv="﻿"+rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="agenda-chef-pitty-"+iso(new Date())+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast("Agenda exportada");
  });

  /* ---------- início ---------- */
  syncSeg();
  session = loadSession();
  if(session){ showApp(); loadEvents(); } else { showLogin(); }
})();
</script>
</body>
</html>
